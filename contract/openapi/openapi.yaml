components:
  schemas:
    AdminMeetingType:
      type: object
      required:
        - id
        - name
        - description
        - durationMin
        - archivedAtMs
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        durationMin:
          type: integer
          format: int32
        archivedAtMs:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
    Availability:
      type: object
      required:
        - meetingType
        - days
      properties:
        meetingType:
          $ref: '#/components/schemas/PublicMeetingType'
        days:
          type: array
          items:
            $ref: '#/components/schemas/DayAvailability'
    BookingConfirmation:
      type: object
      required:
        - meetingType
        - start
        - end
        - durationMin
        - ownerName
        - guestName
        - guestEmail
        - createdAt
      properties:
        meetingType:
          $ref: '#/components/schemas/PublicMeetingType'
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        durationMin:
          type: integer
          format: int32
        ownerName:
          type: string
        guestName:
          type: string
        guestEmail:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateBookingRequest:
      type: object
      required:
        - meetingTypeId
        - start
        - guestName
        - guestEmail
      properties:
        meetingTypeId:
          type: integer
          format: int32
        start:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
        comment:
          type: string
    CreateMeetingTypeRequest:
      type: object
      required:
        - name
        - durationMin
      properties:
        name:
          type: string
        description:
          type: string
        durationMin:
          type: integer
          format: int32
    DayAvailability:
      type: object
      required:
        - date
        - slots
      properties:
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    Owner:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
    PublicMeetingType:
      type: object
      required:
        - id
        - name
        - description
        - durationMin
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        durationMin:
          type: integer
          format: int32
    Slot:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    UpdateMeetingTypeRequest:
      type: object
      required:
        - name
        - durationMin
      properties:
        name:
          type: string
        description:
          type: string
        durationMin:
          type: integer
          format: int32
    UpdateOwnerRequest:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
servers:
  - url: http://localhost:3000
    description: Local development
    variables: {}
