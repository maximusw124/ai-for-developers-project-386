components:
  schemas:
    AdminMeetingType:
      type: object
      required:
        - id
        - name
        - description
        - durationMin
        - archivedAtMs
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        durationMin:
          type: integer
          format: int32
        archivedAtMs:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
    CreateMeetingTypeRequest:
      type: object
      required:
        - name
        - durationMin
      properties:
        name:
          type: string
        description:
          type: string
        durationMin:
          type: integer
          format: int32
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    Owner:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
    PublicMeetingType:
      type: object
      required:
        - id
        - name
        - description
        - durationMin
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        durationMin:
          type: integer
          format: int32
    UpdateMeetingTypeRequest:
      type: object
      required:
        - name
        - durationMin
      properties:
        name:
          type: string
        description:
          type: string
        durationMin:
          type: integer
          format: int32
    UpdateOwnerRequest:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
servers:
  - url: http://localhost:3000
    description: Local development
    variables: {}
