[tools]
node = "22.18.0"

[tasks.install]
description = "Установка всех зависимостей"
run = "npm install"

[tasks.dev]
description = "Запуск бэкенда и фронтенда"
run = "npm run dev"

[tasks.check]
description = "Единая проверка: контракт, линтер, типы, сборка и тесты"
run = "npm run check"

[tasks.test-broken-conflict]
description = "Проверка чувствительности теста конфликта к отключённой защите"
run = "npm run test:broken-conflict"

[tasks."test:broken-conflict"]
description = "Проверка чувствительности теста конфликта к отключённой защите"
run = "npm run test:broken-conflict"

[tasks.e2e]
description = "Сквозной Playwright-тест против настоящего сервера и временной SQLite"
run = "npm run e2e"
