[tools]
node = "22"

[tasks.install]
description = "Установка всех зависимостей"
run = "npm install"

[tasks.dev]
description = "Запуск бэкенда и фронтенда"
run = "npm run dev"

[tasks.check]
description = "Единая проверка: линтер, типы, сборка и дымовой тест"
run = """
npx biome check .
npm run typecheck
npm run build
npm test
"""
